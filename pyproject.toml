[project]
name = "raven"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "face-alignment>=1.4.1",
    "fairseq==0.10.2",
    "hydra-core==1.1.1",    # In the 1.0 series, there is an error in the interpretation of conf.
    "lightning>=2.5.3",
    "matplotlib==3.5.1",
    "numpy==1.23.5",    # fairseq requires <1.24, numba (via face-alignment) requires >=1.21
    "opencv-python>=4.6.0.66",
    "pytorchvideo>=0.1.5",
    "six==1.16.0",
    "tensorboardx>=2.6.4",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "tqdm==4.64.0",
    "wandb>=0.21.1",

    # Required for building fairseq
    "cython>=3.1.3",
    "setuptools>=80.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
fairseq = { git = "https://github.com/facebookresearch/fairseq.git", rev = "v0.10.2" }
