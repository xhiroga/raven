[project]
name = "raven"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fairseq>=0.12.2",
    "matplotlib==3.5.1",
    "numpy==1.21.5",
    "six==1.16.0",
    "torch==1.11.0",
    "torchaudio==0.11.0",
    "torchvision==0.12.0",
    "tqdm==4.64.0",
]

[[tool.uv.index]]
name = "pytorch-cu115"
url = "https://download.pytorch.org/whl/cu115"
